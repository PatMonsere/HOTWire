# HOT 67 pit test checks for the 2026 "Rebuilt" robot (Rebuilt_Systemcore, branch pit_test_mode).
#
# How it works
#   1. Plug in the tether, open HOTWire > Pit Test, press "Start recording".
#   2. Run the robot's pit test routine (Utility mode, enable, driver 'back' button steps).
#      Wait about 2 s between 'back' presses so each step's window can finish.
#   3. Press "Stop & analyze". Each check below gets pass / warn / fail.
#
# There is one check per robot step, in the same order as getPitTestRoutine(). Each check
# starts on a rising edge of start_when AFTER the previous check started, so every
# start_when picks a signal that changes only when that step begins.
#
# Limits come from two runs on the healthy robot (2026-11-24, WPILIB_20261124_221123.wpilog),
# with margin: velocities and positions are close to their setpoints, currents are loose.
# Start-up current spikes vary a lot between runs, so peak_max only catches big problems.
#
# Units are whatever the robot publishes: Kraken Position = rotations,
# Velocity = rotations/s, Supply Current = amps.
# Intake extend position: retracted = 0.61, extended = 0.065 (goes DOWN when it extends).

defaults:
  warn_margin: 0.10      # up to 10 % past a limit = warn, more = fail
  steady_fraction: 0.3   # "steady" = the last 30 % of each check's window
  in_order: true         # checks are expected in this order (like the pit test steps)

# alias: NetworkTables topic (Kraken.java publishes HOT/<Subsystem>/<Device>/<Subsystem><Device><Value>)
signals:
  intake_extend_pos:  HOT/Intake/Extend/IntakeExtendPosition
  intake_extend_amps: HOT/Intake/Extend/IntakeExtendSupply Current
  # NOTE: the three intake roller motors are all named "Roller", so they share one topic.
  intake_roller_vel:  HOT/Intake/Roller/IntakeRollerVelocity
  intake_roller_amps: HOT/Intake/Roller/IntakeRollerSupply Current
  floor_vel:          HOT/Indexer/Floor/IndexerFloorVelocity
  floor_amps:         HOT/Indexer/Floor/IndexerFloorSupply Current
  kick_l_vel:         HOT/Indexer/LeftKick/IndexerLeftKickVelocity
  kick_l_amps:        HOT/Indexer/LeftKick/IndexerLeftKickSupply Current
  kick_r_vel:         HOT/Indexer/RightKick/IndexerRightKickVelocity
  kick_r_amps:        HOT/Indexer/RightKick/IndexerRightKickSupply Current
  # NOTE: Shooter "Left Top" never published anything but 0 on 2026-11-24 (motor missing
  # or not on the CAN bus?), so the checks use Left Bottom and Right Top. It's still
  # recorded (every signal here is), so you can look at it in recording.csv.
  shooter_lt_vel:     HOT/Shooter/Left Top/ShooterLeft TopVelocity
  shooter_lb_vel:     HOT/Shooter/Left Bottom/ShooterLeft BottomVelocity
  shooter_lb_amps:    HOT/Shooter/Left Bottom/ShooterLeft BottomSupply Current
  shooter_rt_vel:     HOT/Shooter/Right Top/ShooterRight TopVelocity
  shooter_rt_amps:    HOT/Shooter/Right Top/ShooterRight TopSupply Current
  hood_pos:           HOT/Shooter/Hood/ShooterHoodPosition
  hood_amps:          HOT/Shooter/Hood/ShooterHoodSupply Current
  drive_amps:         HOT/Drive/TotalCurrent

checks:
  # ---- Step 1: intake (extend, agitate, retract)
  - name: 1a Intake extend
    start_when: intake_extend_pos < 0.3          # moving out from 0.61
    window: 1.5
    expect:
      intake_extend_pos:  { final: 0.065, tolerance: 0.05 }
      intake_extend_amps: { peak_max: 100, steady: [-1, 3] }   # ~0.2 A holding
      intake_roller_vel:  { steady: [100, 130] }                # extend() also spins the rollers (~115)
      intake_roller_amps: { peak_max: 60, steady: [4, 12] }

  - name: 1b Intake agitate
    start_when: intake_extend_pos > 0.1          # pulls back in from 0.065
    window: 1.5
    expect:
      intake_extend_pos:  { peak_min: 0.35, max: 0.5 }          # moves to ~0.44, not all the way in
      intake_extend_amps: { peak_max: 100, steady: [-2, 3] }
      intake_roller_vel:  { steady: [100, 130] }

  - name: 1c Intake retract
    start_when: intake_extend_pos > 0.55
    window: 1.0
    expect:
      intake_extend_pos:  { final: 0.61, tolerance: 0.05 }
      intake_extend_amps: { peak_max: 100, steady: [-1, 2] }
      intake_roller_vel:  { final: 0, tolerance: 5 }            # rollers stopped

  # ---- Step 2: indexer on
  - name: 2 Indexer on
    start_when: abs(kick_l_vel) > 5               # kickers start 0.1 s before the floor
    window: 2.0
    expect:
      floor_vel:   { steady: [60, 80] }                         # ~70
      floor_amps:  { peak_max: 110, steady: [6, 20] }
      kick_l_vel:  { steady: [70, 100] }                        # ~85
      kick_l_amps: { peak_max: 120, steady: [3, 18] }
      kick_r_vel:  { steady: [70, 100] }
      kick_r_amps: { peak_max: 120, steady: [3, 18] }

  # ---- Step 3: shooter presets
  - name: 3a Shooter Batter
    start_when: abs(shooter_lb_vel) > 5
    window: 2.0
    expect:
      shooter_lb_vel:  { settle_to: 39, tolerance: 2.5, within: 1.0 }
      shooter_rt_vel:  { settle_to: 39, tolerance: 2.5, within: 1.0 }
      shooter_lb_amps: { peak_max: 50, steady: [1, 8] }
      shooter_rt_amps: { peak_max: 50, steady: [1, 8] }
      hood_pos:        { final: 3.61, tolerance: 0.15 }
      hood_amps:       { peak_max: 45 }

  - name: 3b Shooter Climber pole
    start_when: hood_pos > 4.3
    window: 1.2
    expect:
      shooter_lb_vel: { settle_to: 41.2, tolerance: 2.5, within: 1.0 }
      shooter_rt_vel: { settle_to: 41.2, tolerance: 2.5, within: 1.0 }
      hood_pos:       { final: 4.91, tolerance: 0.15 }
      hood_amps:      { peak_max: 45 }

  - name: 3c Shooter Passing
    start_when: hood_pos > 7
    window: 1.2
    expect:
      shooter_lb_vel:  { settle_to: 71, tolerance: 3, within: 1.0 }
      shooter_rt_vel:  { settle_to: 71, tolerance: 3, within: 1.0 }
      shooter_lb_amps: { peak_max: 80, steady: [3, 12] }
      shooter_rt_amps: { peak_max: 80, steady: [3, 12] }
      hood_pos:        { final: 9.55, tolerance: 0.2 }
      hood_amps:       { peak_max: 45 }

  - name: 3d Hood down, shooter stop
    start_when: hood_pos < 1
    window: 1.0
    expect:
      hood_pos:  { final: -0.08, tolerance: 0.2 }
      hood_amps: { peak_max: 45 }

  # ---- Step 4: load balls, then fire a test shot
  - name: 4a Load balls
    start_when: intake_extend_pos < 0.3          # intake goes out again
    window: 2.0
    expect:
      intake_extend_pos:  { final: 0.065, tolerance: 0.05 }    # all the way out
      intake_extend_amps: { peak_max: 100, steady: [-1, 3] }   # not pushing against something
      intake_roller_vel:  { steady: [100, 130] }
      floor_vel:          { steady: [-9.5, -5] }               # runFloorSlow: slow reverse, ~-7
      kick_l_vel:         { steady: [-11, -6.5] }              # ~-9
      kick_r_vel:         { steady: [-11, -6.5] }

  - name: 4b Fire test shot
    start_when: abs(shooter_lb_vel) > 5
    window: 2.0
    expect:
      shooter_lb_vel:     { settle_to: 39, tolerance: 2.5, within: 1.0 }
      shooter_rt_vel:     { settle_to: 39, tolerance: 2.5, within: 1.0 }
      hood_pos:           { final: 3.61, tolerance: 0.15 }
      floor_vel:          { steady: [60, 80] }
      floor_amps:         { peak_max: 110, steady: [6, 20] }
      kick_l_vel:         { steady: [65, 100] }
      kick_r_vel:         { steady: [65, 100] }
      intake_roller_vel:  { steady: [90, 125] }                # ~105 while feeding
      intake_extend_pos:  { final: 0.065, tolerance: 0.05 }
      intake_extend_amps: { steady: [-1, 3] }

  # ---- Step 6: circle drive
  - name: 6 Circle drive
    start_when: drive_amps > 10
    window: 2.5
    expect:
      drive_amps: { peak_min: 15, peak_max: 100, steady: [5, 20] }   # peak 29-59 A, steady ~11 A
